      <feDropShadow dx="0" dy="-3" stdDeviation="2" flood-color="#5c2203" flood-opacity=".45"></feDropShadow>
    </filter>

    <linearGradient id="scratch" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d7d7d7"></stop>
      <stop offset="35%" stop-color="#ffffff"></stop>
      <stop offset="70%" stop-color="#a7a7a7"></stop>
      <stop offset="100%" stop-color="#eeeeee"></stop>
    </linearGradient>
  </defs>

  <rect width="760" height="310" fill="#191919"></rect>

  <g filter="url(#realShadow)" transform="rotate(-2 380 155)">
