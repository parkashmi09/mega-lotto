<svg width="760" height="310" viewBox="0 0 760 310" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paperGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4b8"></stop>
      <stop offset="18%" stop-color="#ffd66b"></stop>
      <stop offset="45%" stop-color="#f6a72a"></stop>
      <stop offset="72%" stop-color="#d97812"></stop>
      <stop offset="100%" stop-color="#8f3d08"></stop>
    </linearGradient>

    <radialGradient id="glow" cx="35%" cy="25%" r="80%">
